name: GE360 Core CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ge360-hub/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python
        working-directory: ge360-hub/backend
        run: python -m compileall app connectors

      - name: Run tests
        working-directory: ge360-hub/backend
        run: pytest -q

      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null

      - name: Build core image
        run: docker compose build core
